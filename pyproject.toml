[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-mapper"
version = "0.1.0"
description = "Evidence-backed local architecture mapping for software workspaces"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Architecture Mapper contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
archmap = "packages.cli.main:main"

[tool.setuptools.packages.find]
include = ["packages*"]

[tool.setuptools.package-data]
"packages.graph" = ["schema.sql"]
