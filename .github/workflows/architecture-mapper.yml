name: Architecture Mapper

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute impact
        run: >-
          ./archmap diff
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.sha }}"
          --workspace . --json > archmap-diff.json
      - name: Render comment
        run: python3 -m packages.action.comment archmap-diff.json > archmap-comment.md
      - name: Update sticky comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- architecture-mapper -->';
            const body = fs.readFileSync('archmap-comment.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
